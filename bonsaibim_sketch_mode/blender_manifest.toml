schema_version = "1.0.0"

id = "bonsaibim_sketch_mode"
version = "0.2.3"
name = "BonsaiBIM Sketch Mode"
tagline = "Direct-modelling interaction for Bonsai IFC authoring"
# A GitHub noreply address: this string ships inside every release zip, so it
# is a stable identifier rather than a mailbox. Report problems on the issue
# tracker linked from `website`.
maintainer = "Innovations & Integrations <integrations-space@users.noreply.github.com>"
type = "add-on"

website = "https://github.com/integrations-space/BonsaiSketch"

tags = ["3D View", "Modeling", "User Interface"]

# Supported Blender: 5.0 through 5.2.
#
# The constraint is Bonsai's, not ours: it ships compiled wheels, so it only
# runs where those match the host Python. Bonsai 0.8.4's were cp310/cp311,
# which put Blender 5.2 (Python 3.13) out of reach. Bonsai 0.8.5 ships wheels
# for 3.13, and `import bonsai.tool` succeeds on 5.2 -- verified, not assumed.
#
# The upper bound stays, one minor version past the last one tested. Without it
# Blender would offer to install this into releases nobody has run it on, and
# the failure mode when Bonsai's wheels next fall behind is silent breakage
# rather than a clear refusal.
blender_version_min = "5.0.0"
blender_version_max = "5.3.0"  # exclusive; 5.0 and 5.2 tested, 5.1 assumed

# Must remain GPL-compatible: this add-on imports and derives from Bonsai,
# which is licensed GPL-3.0-or-later.
license = ["SPDX:GPL-3.0-or-later"]

# NOTE: Blender's extension system has no inter-extension dependency
# declaration as of 4.2/5.0, so the Bonsai dependency is enforced at
# runtime in bridge.py rather than declared here.
#
# TRADEMARK NOTE: SketchUp is a trademark of Trimble Inc. This add-on is not
# affiliated with, endorsed by, or sponsored by Trimble. SketchUp is referred
# to descriptively only, to identify the interaction model that users may
# already be familiar with. All icons and visual design are original work.
