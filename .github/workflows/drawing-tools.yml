name: Drawing tools
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  drawing-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ifcopenshell==0.8.4.post1 shapely==2.0.6
      - run: python tools/drawing_pipeline_check.py
